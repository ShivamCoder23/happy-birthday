name: PR Review Bot
on:
  pull_request:
    types: [opened, synchronize, edited]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run PR Review Bot
        uses: sudhanshutech/PRGuard@v1.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
